[project]
name = "mini-gauntlet"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.1.9",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.4", "httpx==0.28.1"]

[tool.setuptools]
packages = ["app", "app.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx`"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP038"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Body", "fastapi.Query"]
