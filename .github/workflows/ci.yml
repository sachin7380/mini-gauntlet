name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q

  frontend:
    name: Frontend (eslint + tsc + vitest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test

  images:
    name: Build images + compose smoke test
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build both images (same Dockerfiles compose uses)
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 120
      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          id=$(curl -fsS -X POST http://localhost:8000/api/scans | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 30); do
            status=$(curl -fsS http://localhost:8000/api/scans/$id | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            [ "$status" != "RUNNING" ] && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/scans/$id | tee /dev/stderr | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          assert d["status"] == "COMPLETED", d
          assert d["score"] == 60.0, d["score"]
          assert d["counts"] == {"PASS": 27, "FAIL": 18, "CANNOT_SCAN": 4}, d["counts"]
          print("smoke test OK")'
      - name: Check containers run as non-root
        run: |
          [ "$(docker compose exec -T api id -u)" != "0" ]
          [ "$(docker compose exec -T web id -u)" != "0" ]
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down -v
